name: kanban

x-healthcheck-timing: &healthcheck-timing
  interval: 3s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kanban
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kanban:${POSTGRES_PASSWORD}@postgres:5432/kanban
      CORS_ORIGIN: ${APP_URL:?set APP_URL}
      PORT: "3333"
      LOG_LEVEL: info
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:3333
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_SITE: ${APP_SITE:?set APP_SITE}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
